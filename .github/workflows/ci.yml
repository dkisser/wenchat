name: CI

# YAML indentation uses 2 spaces, not tabs. js-yaml (which backs GitHub
# Actions' parser) rejects tab characters at the start of a line; the
# tabs that Biome enforces for JS/TS do not apply to YAML files.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same branch on new pushes; concurrency
# isolation by ref keeps main fast and feature branches independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        # Bun version is pinned in package.json's `packageManager` field —
        # this action auto-detects it (falls back to `engines.bun`, then
        # `latest`). When bumping the local toolchain, edit package.json;
        # do NOT add an explicit `bun-version` here, or the two will drift
        # again on the next upgrade (see commit 92a92f1 for the original
        # incident).
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        # bun test uses the default test glob; packages/core/tests/integration/*
        # has 5s setInterval timeouts and is intentionally excluded here.
        run: bun test
      - name: Build (tsc)
        run: bun run build
      - name: Smoke test (LAN bind regression)
        # Validates the signaling server bind logic from commit d02de50
        # (loopback blocked, LAN reachable) on the GitHub Linux runner.
        run: bun scripts/smoke-lan-bind.ts